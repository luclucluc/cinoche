<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Paris Ciné — toutes les séances de Paris</title>
    <meta name="description" content="Le programme de tous les cinémas de Paris et de la proche banlieue, en un coup d'œil." />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%23e5484d'/></svg>" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="top">
      <div class="top-inner">
        <a class="logo" href="./">paris<span>·</span>ciné</a>
        <label class="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg>
          <input id="q" type="search" placeholder="Film, réalisateur, acteur, cinéma…" autocomplete="off" />
          <kbd>/</kbd>
        </label>
        <button id="theme" class="icon-btn" title="Changer de thème" aria-label="Changer de thème">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z" /></svg>
        </button>
      </div>

      <nav class="tabs" id="tabs" aria-label="Sélection">
        <button data-tab="all" class="on">Tous les films</button>
        <button data-tab="new">Nouveautés</button>
        <button data-tab="classic">Classiques</button>
        <button data-tab="retro">Rétrospectives</button>
        <span class="spacer"></span>
        <div class="seg" id="view" role="group" aria-label="Vue">
          <button data-view="films" class="on">Films</button>
          <button data-view="cinemas">Cinémas</button>
          <button data-view="map">Carte</button>
        </div>
      </nav>

      <div class="days" id="days" role="tablist" aria-label="Jour"></div>

      <div class="geo" id="geo" hidden>
        <button id="locate" class="pill" title="Utiliser ma position">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" /><path d="M12 2v3M12 19v3M2 12h3M19 12h3" /><circle cx="12" cy="12" r="7" /></svg>
          Ma position
        </button>
        <div class="addr">
          <input id="addr" type="search" placeholder="ou une adresse : 12 rue de Rivoli…" autocomplete="off" aria-label="Adresse" />
          <ul id="addrList" class="suggest" hidden></ul>
        </div>
        <select id="radius" aria-label="Rayon">
          <option value="500">500 m</option>
          <option value="1000">1 km</option>
          <option value="2000">2 km</option>
          <option value="3000">3 km</option>
          <option value="5000">5 km</option>
          <option value="10000">10 km</option>
        </select>
      </div>
      <p class="geo-status" id="geoStatus" hidden></p>

      <div class="filters" id="filters">
        <div class="seg" id="version" role="group" aria-label="Version">
          <button data-v="" class="on">VO & VF</button>
          <button data-v="VO">VO</button>
          <button data-v="VF">VF</button>
        </div>
        <button class="chip" data-f="hours"></button>
        <button class="chip" data-f="zone"></button>
        <button class="chip" data-f="cinemas"></button>
        <button class="chip" data-f="cards"></button>
        <button class="chip" data-f="langs"></button>
        <button class="chip" data-f="genres"></button>
        <button class="chip" data-f="formats"></button>
        <button class="chip" data-f="sort"></button>
        <button class="link reset" id="reset" hidden>Réinitialiser</button>
      </div>
      <div class="pop" id="pop" hidden></div>
    </header>

    <main id="main">
      <section class="map-box" id="mapBox" hidden><div id="map"></div></section>
      <section class="list-col">
        <p class="summary" id="summary"></p>
        <div class="list-head" id="listHead"></div>
        <ol class="list" id="list"></ol>
        <p class="empty" id="empty" hidden>Aucune séance ne correspond à ces filtres.</p>
      </section>
    </main>

    <footer class="foot">
      <span id="updated"></span>
      <span>Vos préférences (favoris, position, thème) restent dans ce navigateur. <button id="forget" class="link">Tout effacer</button></span>
      <span>Données : Allociné · Adresses : BAN · Carte : OpenFreeMap / OpenStreetMap</span>
    </footer>

    <script type="module" src="app.js"></script>
  </body>
</html>
