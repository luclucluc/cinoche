name: Mise à jour et déploiement

on:
  schedule:
    - cron: '30 3 * * *' # chaque nuit vers 4 h 30 / 5 h 30 (heure de Paris)
  workflow_dispatch: # bouton « Run workflow » dans l'onglet Actions
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Un push qui ne touche pas au scraper réutilise les données en ligne (publication en ~1 min).
      # Le scraping complet a lieu chaque nuit, à la demande, et quand le scraper change.
      - name: Faut-il relancer le scraping ?
        id: mode
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then echo "scrape=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          BEFORE="${{ github.event.before }}"
          if git cat-file -e "$BEFORE" 2>/dev/null && ! git diff --name-only "$BEFORE" "${{ github.sha }}" | grep -qE '^(scraper/|package\.json)'; then
            mkdir -p public/data
            BASE="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data"
            curl -sf "$BASE/press.json" -o public/data/press.json || true
            if curl -sf "$BASE/programme.json" -o public/data/programme.json; then
              echo "Données en ligne réutilisées"; echo "scrape=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
          fi
          echo "scrape=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        if: steps.mode.outputs.scrape == 'true'
        with:
          node-version: 24

      # Cache des correspondances et des notes (SensCritique, IMDb, Letterboxd…) d'une nuit à l'autre
      - uses: actions/cache@v6
        if: steps.mode.outputs.scrape == 'true'
        with:
          path: .cache
          key: notes-${{ github.run_id }}
          restore-keys: notes-

      - name: Récupération des séances, géocodage et notes
        if: steps.mode.outputs.scrape == 'true'
        run: npm run scrape
        env:
          TZ: Europe/Paris

      # Version des fichiers dans les liens : le navigateur ne mélange jamais une nouvelle page
      # avec une ancienne feuille de style ou d'anciens scripts (cache de 10 min de GitHub Pages)
      - name: Numéros de version des fichiers
        run: |
          V=${GITHUB_SHA::8}
          sed -i -E "s#(href|src)=\"(style\.css|app\.js)\"#\1=\"\2?v=$V\"#g" public/index.html
          sed -i -E "s#from '\./([a-z]+\.js)'#from './\1?v=$V'#g" public/*.js
          grep -n "?v=" public/index.html public/*.js | head

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
